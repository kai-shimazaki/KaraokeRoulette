<script>
const list = document.getElementById("list");
const count = document.getElementById("count");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");

function getItems() {
    return list.value
        .split("\n")
        .map(line => line.trim())
        .filter(line => line !== "")
        .filter(line => !line.startsWith("#"))
        .filter(line => !line.startsWith("//"));
}

function updateCount() {
    const items = getItems();
    count.textContent = "現在の候補数： " + items.length + "件";
}

function spin() {

    const items = getItems();

    if (items.length === 0) {
        result.textContent = "候補がありません";
        return;
    }

    spinButton.disabled = true;

    let numberOfChanges = 0;

    const timer = setInterval(function () {

        const temporaryItem =items[Math.floor(Math.random() * items.length)];

        result.textContent = "抽選中\n" + temporaryItem;

        numberOfChanges++;

        if (numberOfChanges >= 10) {

            clearInterval(timer);

            const winner =items[Math.floor(Math.random() * items.length)];

            result.textContent = "今回のお題\n" + winner;

            spinButton.disabled = false;
        }

    }, 100);
}

list.addEventListener("input", updateCount);

updateCount();

</script>
